name: Build & release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Build & release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check release secrets
        env:
          RPD_UPSTREAM_URL: ${{ secrets.RPD_UPSTREAM_URL }}
          RPD_RELEASE_KEYSTORE_BASE64: ${{ secrets.RPD_RELEASE_KEYSTORE_BASE64 }}
          RPD_RELEASE_KEY_ALIAS: ${{ secrets.RPD_RELEASE_KEY_ALIAS }}
          RPD_RELEASE_STORE_PASSWORD: ${{ secrets.RPD_RELEASE_STORE_PASSWORD }}
          RPD_RELEASE_KEY_PASSWORD: ${{ secrets.RPD_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in RPD_UPSTREAM_URL RPD_RELEASE_KEYSTORE_BASE64 RPD_RELEASE_KEY_ALIAS RPD_RELEASE_STORE_PASSWORD RPD_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if ((${#missing[@]})); then
            printf 'Missing GitHub Actions secrets: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Read app version
        id: version
        run: |
          set -euo pipefail
          version_name=$(sed -n 's/^version_name=${RPD_VERSION_NAME:-\(.*\)}/\1/p' build.sh)
          version_code=$(sed -n 's/^version_code=${RPD_VERSION_CODE:-\(.*\)}/\1/p' build.sh)
          if [[ -z "$version_name" || -z "$version_code" ]]; then
            echo "Could not read RPD_VERSION_NAME or RPD_VERSION_CODE from build.sh."
            exit 1
          fi
          echo "name=$version_name" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          if ! sdkmanager --install "platforms;android-37.0"; then
            sdkmanager --install "platforms;android-37"
          fi
          sdkmanager --install "build-tools;36.0.0"
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$sdk_root" ]]; then
            echo "ANDROID_HOME is not set."
            exit 1
          fi
          platform_dir=$(find "$sdk_root/platforms" -mindepth 1 -maxdepth 1 -type d -name 'android-37*' | sort | head -n 1)
          if [[ -z "$platform_dir" ]]; then
            echo "Android SDK platform 37 was not installed."
            exit 1
          fi
          {
            echo "ANDROID_HOME=$sdk_root"
            echo "ANDROID_PLATFORM=$(basename "$platform_dir")"
          } >> "$GITHUB_ENV"

      - name: Prepare release keystore
        env:
          RPD_RELEASE_KEYSTORE_BASE64: ${{ secrets.RPD_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/release.jks"
          printf '%s' "$RPD_RELEASE_KEYSTORE_BASE64" | base64 -d > "$keystore"
          echo "RPD_RELEASE_KEYSTORE=$keystore" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          RPD_UPSTREAM_URL: ${{ secrets.RPD_UPSTREAM_URL }}
          RPD_RELEASE_KEY_ALIAS: ${{ secrets.RPD_RELEASE_KEY_ALIAS }}
          RPD_RELEASE_STORE_PASSWORD: ${{ secrets.RPD_RELEASE_STORE_PASSWORD }}
          RPD_RELEASE_KEY_PASSWORD: ${{ secrets.RPD_RELEASE_KEY_PASSWORD }}
        run: ./build.sh

      - name: Collect pushed commit messages
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/changelog.md"
          {
            echo "Changes in this push:"
            echo
            if [[ "$PUSH_BEFORE" =~ ^0+$ ]]; then
              git log --reverse --pretty=format:'- %s'
            else
              git log --reverse --pretty=format:'- %s' "$PUSH_BEFORE..HEAD"
            fi
            echo
          } > "$notes"
          if ! grep -q '^- ' "$notes"; then
            echo "- No commit messages were found for this push." >> "$notes"
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          tag="v${VERSION_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists. Bump RPD_VERSION_NAME and RPD_VERSION_CODE in build.sh, then push again."
            exit 1
          fi
          gh release create "$tag" \
            --title "Distributor Ramaputra ${VERSION_NAME} (${VERSION_CODE})" \
            --notes-file "$RUNNER_TEMP/changelog.md" \
            "/tmp/rpd-dms/app-release.apk#distributor-ramaputra-${VERSION_NAME}.apk"
